<!--Question 9 (6 Marks)
Create a nested list showing:
At least 3 Indian states
Each state should have at least 3 cities
Use unordered list for states and ordered list for cities-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Indian States And Cities</h2>
    <ul>
        <li>Maharashtra</li>
        <ol>
            <li>Nagpur</li>
            <li>Nashik</li>
            <li>Mumbai</li>
        </ol>
        <li>Karnataka</li>
        <ol>
            <li>Bengaluru</li>
            <li>Mysuru</li>
            <li>Mangaluru</li>
        </ol>
        <li>Rajasthan</li>
        <ol>
            <li>Jaipur</li>
            <li>Jodhpur</li>
            <li>Udaypur</li>
        </ol>
    </ul>
</body>
</html>
