<!--Question 11 (10 Marks)
Create a Student Data Table:
Table with border, cellpadding, cellspacing
Columns: Roll No, Name, Course, City
At least 5 rows of student data
Use thead and tbody
Merge cells using colspan (e.g., same city for multiple students)-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="5" cellpadding="5" cellspacing="5">
        <tr>
            <thead>Student Data</thead>
            <th>Roll No</th>
            <th>Name</th>
            <th>Course</th>
            <th>City</th>
        </tr>

        </tr>
        <tr>
            <td>2</td>

            <td>Mcs</td>
            <td rowspan="2">Pune</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Siyaa</td>
            <td>MCA</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Piyaa</td>

        </tr>
        <tr>
            <td>5</td>

        </tr>
    </table>
</body>
</html>
